[package]
name = "mcpg-plugin-watch-file"
version = "0.1.0-alpha.16"
license = "Apache-2.0"
edition = "2024"
description = "Filesystem watch_strategy plugin for MCPG (dev.mcpg.watch.file) — resource-change ticks on path create/modify/remove."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14", features = ["static-firstparty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
tracing = "0.1"

[features]
default = []
cdylib-export = []
static-firstparty = []
